# XcodeGen spec. The .xcodeproj is generated in CI with `xcodegen generate`
# and is never committed.
#
# TODO (da confermare con l'utente):
#   - deploymentTarget iOS: valore provvisorio, da allineare alla versione
#     di iOS installata sull'iPhone.
#   - PRODUCT_BUNDLE_IDENTIFIER: segnaposto com.NOMEUTENTE.ltidi.
name: LTIDI

options:
  bundleIdPrefix: com.NOMEUTENTE
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  LTIDICore:
    path: ../../packages/LTIDICore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is intentionally empty: CI builds pass CODE_SIGNING_ALLOWED=NO,
    # the unsigned .ipa is signed later on the Mac/Windows side with
    # Sideloadly/SideStore. A TestFlight job can override DEVELOPMENT_TEAM
    # and CODE_SIGN_STYLE from the command line without touching this file.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  LTIDI:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: LTIDICore
        product: LTIDICore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.NOMEUTENTE.ltidi
        PRODUCT_NAME: LTIDI
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist   # generated by XcodeGen from the properties below (git-ignored)
      properties:
        CFBundleDisplayName: LTIDI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true

schemes:
  LTIDI:
    build:
      targets:
        LTIDI: all
    run:
      config: Debug
    archive:
      config: Release
